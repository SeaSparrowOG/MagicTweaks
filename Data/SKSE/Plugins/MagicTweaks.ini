; ======================================================================
;                  This mod supports a "custom" INI!
; ======================================================================

; To use it, simply make a new file called MagicTweaks_Custom.ini and
; place it in Data/SKSE/Plugins next to this INI.

; You can add any number of settings to it, and they will override 
; settings in this INI if they are valid. This will help you avoid
; having to re-apply your settings on every update.

; Straight up bugfixes. Default: On.
[Fixes]
; Poison, from poisoned weapons and traps, will no longer be treated as a spell that can be absorbed.
bNeverAbsorbPoison = 1
; Effects that would apply to their own caster will no longer be absorbed by said caster.
bNeverAbsorbSelfTargettingEffects = 1
; Beneficial effects, such as healing effects, will no longer be absorbed by their recipients.
bNeverAbsorbBeneficialEffects = 1
; Cloak spells that were not dual cast will no longer gain their dual-cast boost while the caster is
; dual casting any spell.
bFixCloakArchetype = 1

; Changes to how magic behave that improve the experience. Default: Off.
[Tweaks]
; Spell duration will not elapse during dialogue, bartering, or giving gifts.
bExtendEffectsInDialogue = 0
; Certain effects, such as Bound Quiver or Bound Shield, will be dispeled when you lower your hands.
bDispelOnSheathe = 0
; You will gain some experience when you hit an enemy with a bound weapon, or a conjured creature you control.
bEarnConjurationHitExp = 0

; Entirely subjective gameplay changes. Default: Off.
[Gameplay]
; Bound effects take up a portion of your Health, Magicka, and/or stamina in order to never expire.
; Automatically turned on if "VanillaBoundSpells.esp" is active.
bSpellBinding = 0
; Survival Mode bars are hijacked to instead display how much of a property is "bound".
bSpellBindingUI = 0
; When entering combat, you gain experience for each bound spell you have active.
bSpellBindingEXP = 0
; Adds a new Actor Value called Magicka Shield. Recommended to use with Actor Value Generator by Noahboddie.
; Automatically turned on if MagicTweaks_MagickaShield.esp is active.
bMagickaShield = 0
; Makes casting slower if you are trying to cast a spell of a higher level than your own skill.
; Levels are Novice/Apprentice/Adept/Expert/Master, and are determined the same way vanilla does.
bCastingSpeed = 0
; What penalty each tier above your current skill applies, additive. A novice casting an apprentice spell
; will have a 50% slowdown, an adept spell 100%, a master spell 200%. No effect if bCastingSpeed is off.
fCastingSpeedSlowdown = 50.0
; Limits how many higher tiers the player has access to. 1 means novices can cast apprentice spells, but not adept+.
; 2 is novices can cast apprentice and adept spells, but not expert+. No effect if bCastingSpeed is off, set to 0 to disable.
iCastingSpeedTierLimit = 0

; Backend systems that can be used by other mods. Default: On.
; I recommend not disabling these, but no harm if you do.
[Systems]
bDynamicSpellDescriptions = 1
bAdditionalConditions = 1